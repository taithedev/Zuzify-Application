name: Zuzify Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm install --no-audit --no-fund
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: npm install --no-audit --no-fund
        working-directory: server
      - run: npm test
        working-directory: server
      - run: dotnet publish Zuzify.csproj -c Release -r win-x64 --self-contained true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: Zuzify-Windows-x64
          path: publish/
